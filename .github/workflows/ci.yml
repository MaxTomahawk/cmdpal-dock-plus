name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [implementation/**, main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  managed-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore CmdPalDockPlus.sln
      - name: Test Core
        shell: pwsh
        run: dotnet test tests/CmdPalDockPlus.Core.Tests/CmdPalDockPlus.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx"
      - name: Test Windows
        shell: pwsh
        run: dotnet test tests/CmdPalDockPlus.Windows.Tests/CmdPalDockPlus.Windows.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=windows.trx"
  extension-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore extension
        shell: pwsh
        run: dotnet restore src/CmdPalDockPlus.Extension/CmdPalDockPlus.Extension.csproj -p:Platform=x64
      - name: Build extension x64
        shell: pwsh
        run: dotnet build src/CmdPalDockPlus.Extension/CmdPalDockPlus.Extension.csproj -c Release -p:Platform=x64 --no-restore
