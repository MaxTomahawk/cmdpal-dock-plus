name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [implementation/**, main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  managed-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore CmdPalDockPlus.sln
      - name: Test
        shell: pwsh
        run: dotnet test CmdPalDockPlus.sln -c Release --no-restore --logger "trx;LogFileName=tests.trx"
