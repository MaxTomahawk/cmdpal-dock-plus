name: Patch README for v0.1.2

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/patch-readme-v0.1.2.yml']

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update installer documentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          v011 = "`v0.1.1` changes the default unsigned-package installer to `Install-Unsigned.cmd` so installation still works on machines where Group Policy requires PowerShell script files to be signed. The actual package-install command is unchanged: `Add-AppxPackage -AllowUnsigned`."
          v012 = "`v0.1.2` fixes Windows deployment error `0x80073D2C` (`ERROR_UNSIGNED_PACKAGE_INVALID_PUBLISHER_NAMESPACE`) by using the Windows-defined unsigned-package publisher OID required by `Add-AppxPackage -AllowUnsigned`. Do not use the v0.1.1 package for unsigned installation; use v0.1.2 or newer."
          if v012 not in text:
              if v011 not in text:
                  raise SystemExit('Expected v0.1.1 status paragraph not found')
              text = text.replace(v011, v011 + '\n\n' + v012, 1)

          text = text.replace('CmdPalDockPlus-0.1.1.msixbundle', 'CmdPalDockPlus-0.1.2.msixbundle')

          marker = '### Unsigned development channel'
          troubleshooting = """### Troubleshooting `0x80073D2C`\n\nIf Windows reports:\n\n```text\nThe package deployment failed because its publisher is not in the unsigned namespace.\n0x80073D2C / ERROR_UNSIGNED_PACKAGE_INVALID_PUBLISHER_NAMESPACE\n```\n\nuse **v0.1.2 or newer**. v0.1.1 used an incorrect publisher OID in the MSIX identity. Do not work around this by disabling Windows security policy or installing a made-up certificate; replace the old bundle with a current release. CI and the Release workflow now inspect the `AppxManifest.xml` inside every newly built x64/ARM64 MSIX and reject packages that do not use the Windows-defined unsigned publisher namespace.\n\n"""
          if '### Troubleshooting `0x80073D2C`' not in text:
              if marker not in text:
                  raise SystemExit('Unsigned development channel marker not found')
              text = text.replace(marker, troubleshooting + marker, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'README already current'
            exit 0
          fi
          git commit -m 'docs: document v0.1.2 unsigned publisher fix'
          git push origin HEAD:main
